const chapters=[{"id": 1, "en": "Introduction to Biopharmaceutics and Pharmacokinetics", "ar": "مقدمة في الصيدلانيات الحيوية والحرائك الدوائية", "start": 1, "end": 25, "ex": "Distinguish drug release, absorption, distribution, metabolism, excretion, and pharmacodynamic response.", "ax": "ميّز بين تحرر الدواء وامتصاصه وتوزيعه واستقلابه وإطراحه والاستجابة الدوائية.", "ey": "Bioavailability describes the fraction reaching systemic circulation; exposure does not alone establish clinical efficacy.", "ay": "التوافر الحيوي يصف الجزء الذي يصل للدوران الجهازي، ولا يعني التعرض الدوائي وحده ضمان الفعالية."}, {"id": 2, "en": "Mathematical Fundamentals", "ar": "الأسس الرياضية", "start": 27, "end": 50, "ex": "Use exponential functions, logarithms, slopes, units and reaction order to interpret concentration-time curves.", "ax": "استخدم الدوال الأسية واللوغاريتمات والميل والوحدات ورتبة التفاعل لتفسير منحنيات التركيز والزمن.", "ey": "A first-order process eliminates a constant fraction per unit time, not a constant amount.", "ay": "في عملية الرتبة الأولى يُزال جزء ثابت من الكمية في وحدة الزمن، لا كمية ثابتة."}, {"id": 3, "en": "Biostatistics", "ar": "الإحصاء الحيوي", "start": 51, "end": 73, "ex": "Summarize data using central tendency, variability, confidence intervals and appropriate hypothesis tests.", "ax": "لخّص البيانات بالنزعة المركزية والتشتت وفواصل الثقة والاختبارات الإحصائية المناسبة.", "ey": "Statistical significance is not equivalent to clinical importance.", "ay": "الدلالة الإحصائية ليست بالضرورة أهمية سريرية."}, {"id": 4, "en": "One-Compartment Open Model: IV Bolus", "ar": "نموذج الحجرة الواحدة: الحقن الوريدي المباشر", "start": 75, "end": 96, "ex": "After an IV bolus and rapid distribution, concentration declines monoexponentially when elimination is first-order.", "ax": "بعد الحقن الوريدي والتوزع السريع ينخفض التركيز أسيًا عندما يكون الإطراح من الرتبة الأولى.", "ey": "C(t)=C₀e^(−kt), Vd=Dose/C₀, CL=kVd and t½=0.693/k.", "ay": "C(t)=C₀e^(−kt)، وحجم التوزيع = الجرعة/C₀، والتصفية = k×Vd، ونصف العمر = 0.693/k."}, {"id": 5, "en": "Multicompartment Models: IV Bolus", "ar": "نماذج الحجرات المتعددة: الحقن الوريدي", "start": 97, "end": 129, "ex": "Identify an initial distribution phase and a later terminal phase; one exponential may not describe the whole curve.", "ax": "ميّز مرحلة التوزع الأولية من المرحلة النهائية؛ فقد لا تكفي دالة أسية واحدة لوصف المنحنى.", "ey": "In a two-compartment model, C(t)=Ae^(−αt)+Be^(−βt).", "ay": "في نموذج الحجرتين C(t)=Ae^(−αt)+Be^(−βt)."}, {"id": 6, "en": "Intravenous Infusion", "ar": "التسريب الوريدي", "start": 131, "end": 148, "ex": "Understand input at a constant rate, approach to steady state, and concentration decline after stopping infusion.", "ax": "افهم الإدخال بمعدل ثابت والاقتراب من حالة الثبات وانخفاض التركيز بعد وقف التسريب.", "ey": "At steady state for linear kinetics, Css=R₀/CL.", "ay": "عند الثبات في الحرائك الخطية Css=R₀/CL."}, {"id": 7, "en": "Drug Elimination, Clearance, and Renal Clearance", "ar": "إطراح الدواء والتصفية الكلوية", "start": 149, "end": 175, "ex": "Differentiate total clearance from renal clearance and relate filtration, secretion and reabsorption.", "ax": "فرّق بين التصفية الكلية والكلوية واربطها بالترشيح والإفراز وإعادة الامتصاص.", "ey": "CLrenal=(urinary excretion rate)/plasma concentration under appropriate conditions.", "ay": "التصفية الكلوية = معدل الإطراح البولي/تركيز البلازما ضمن الشروط الملائمة."}, {"id": 8, "en": "Pharmacokinetics of Oral Absorption", "ar": "حرائك الامتصاص الفموي", "start": 177, "end": 204, "ex": "Study absorption-rate constants, lag time, first-pass loss, peak concentration and time to peak.", "ax": "ادرس ثابت سرعة الامتصاص وزمن التأخر والمرور الأول والتركيز الأعظمي ووقت بلوغه.", "ey": "Oral exposure depends on bioavailability F as well as dose and clearance.", "ay": "يعتمد التعرض الفموي على التوافر الحيوي F والجرعة والتصفية."}, {"id": 9, "en": "Multiple-Dosage Regimens", "ar": "أنظمة الجرعات المتكررة", "start": 205, "end": 228, "ex": "Explore accumulation, dosing intervals, peaks, troughs and the approach to steady state.", "ax": "استكشف التراكم والفاصل بين الجرعات والذروة والحضيض والاقتراب من الثبات.", "ey": "Repeated dosing may accumulate even when each individual dose is unchanged.", "ay": "قد يحدث تراكم مع تكرار الجرعات رغم ثبات مقدار كل جرعة."}, {"id": 10, "en": "Nonlinear Pharmacokinetics", "ar": "الحرائك الدوائية غير الخطية", "start": 229, "end": 258, "ex": "Recognize capacity-limited metabolism and concentration-dependent clearance.", "ax": "تعرّف إلى الاستقلاب محدود السعة والتصفية المعتمدة على التركيز.", "ey": "Michaelis–Menten rate=Vmax·C/(Km+C); small dose changes can cause disproportionate exposure changes.", "ay": "معدل ميكايليس–منتن = Vmax·C/(Km+C)، وقد تسبب زيادة صغيرة بالجرعة تغيرًا كبيرًا في التعرض."}, {"id": 11, "en": "Physiologic Drug Distribution and Protein Binding", "ar": "التوزيع الفسيولوجي والارتباط بالبروتين", "start": 259, "end": 307, "ex": "Examine tissue perfusion, plasma protein binding and free versus total drug concentration.", "ax": "افحص تروية الأنسجة والارتباط ببروتينات البلازما والفرق بين التركيز الحر والكلي.", "ey": "Only unbound drug is generally available for many distribution and elimination processes.", "ay": "الدواء الحر هو المتاح عادةً لكثير من عمليات التوزيع والإطراح."}, {"id": 12, "en": "Drug Elimination and Hepatic Clearance", "ar": "إطراح الدواء والتصفية الكبدية", "start": 309, "end": 355, "ex": "Explain hepatic blood flow, intrinsic clearance, extraction and first-pass metabolism.", "ax": "اشرح تدفق الدم الكبدي والتصفية الذاتية والاستخلاص واستقلاب المرور الأول.", "ey": "High-extraction and low-extraction drugs respond differently to flow and binding changes.", "ay": "تختلف استجابة الأدوية عالية ومنخفضة الاستخلاص لتغيرات التدفق والارتباط."}, {"id": 13, "en": "Pharmacogenetics and Drug Metabolism", "ar": "الوراثة الدوائية والاستقلاب", "start": 357, "end": 370, "ex": "Describe genetic variation in metabolic enzymes and transporters and its effect on exposure.", "ax": "صف الاختلافات الوراثية في إنزيمات الاستقلاب والنواقل وتأثيرها في التعرض الدوائي.", "ey": "Genotype may alter exposure but does not replace clinical evaluation.", "ay": "قد يؤثر النمط الجيني في التعرض لكنه لا يغني عن التقييم السريري."}, {"id": 14, "en": "Physiologic Factors Related to Drug Absorption", "ar": "العوامل الفسيولوجية المؤثرة في الامتصاص", "start": 373, "end": 414, "ex": "Consider GI pH, transit time, permeability, transporters and food effects.", "ax": "ناقش حموضة الجهاز الهضمي وزمن العبور والنفاذية والنواقل وتأثير الطعام.", "ey": "Drug dissolution and membrane permeability jointly influence absorption.", "ay": "يؤثر انحلال الدواء ونفاذيته عبر الأغشية معًا في الامتصاص."}, {"id": 15, "en": "Drug Product Design and In Vitro Performance", "ar": "تصميم المستحضرات وأداؤها مخبريًا", "start": 415, "end": 466, "ex": "Study dissolution testing, formulation variables, stability and in vitro–in vivo relationships.", "ax": "ادرس اختبار الانحلال ومتغيرات التركيبة والثبات والعلاقة بين المختبر والجسم.", "ey": "An in vitro dissolution result alone may not predict clinical equivalence.", "ay": "لا يكفي اختبار الانحلال المخبري وحده للتنبؤ بالتكافؤ السريري."}, {"id": 16, "en": "Bioavailability and Bioequivalence", "ar": "التوافر الحيوي والتكافؤ الحيوي", "start": 469, "end": 526, "ex": "Interpret AUC, Cmax, Tmax, crossover designs and comparisons of test and reference products.", "ax": "فسّر AUC وCmax وTmax وتصاميم التبادل ومقارنة المستحضر الاختباري بالمرجعي.", "ey": "Bioequivalence requires an appropriate study design and statistical criteria, not identical curves.", "ay": "يتطلب التكافؤ الحيوي تصميمًا إحصائيًا مناسبًا ومعايير محددة لا تطابق المنحنيات حرفيًا."}, {"id": 17, "en": "Active Ingredient and Pharmaceutical Equivalence", "ar": "المادة الفعالة والتكافؤ الصيدلاني", "start": 529, "end": 542, "ex": "Differentiate pharmaceutical equivalence, alternatives, manufacturing changes and therapeutic equivalence.", "ax": "فرّق بين التكافؤ الصيدلاني والبدائل وتغيرات التصنيع والتكافؤ العلاجي.", "ey": "Same labeled ingredient does not by itself prove bioequivalence.", "ay": "وجود المادة الفعالة نفسها لا يثبت وحده التكافؤ الحيوي."}, {"id": 18, "en": "Product Quality and Clinical Efficacy", "ar": "جودة المستحضر والفعالية السريرية", "start": 545, "end": 565, "ex": "Connect quality control, risk assessment, manufacturing variability and postmarketing surveillance.", "ax": "اربط ضبط الجودة وتقييم المخاطر وتباين التصنيع والمراقبة بعد التسويق.", "ey": "Quality failures can change exposure even when nominal dose is unchanged.", "ay": "قد تغير عيوب الجودة التعرض الدوائي رغم ثبات الجرعة الاسمية."}, {"id": 19, "en": "Modified-Release Products and Devices", "ar": "المستحضرات معدّلة التحرر والأجهزة", "start": 567, "end": 613, "ex": "Contrast immediate and modified release, release mechanisms and potential dose dumping.", "ax": "قارن التحرر الفوري بالمعدل وآليات التحرر واحتمال إطلاق الجرعة دفعة واحدة.", "ey": "Never assume a modified-release product can be crushed or substituted without checking labeling.", "ay": "لا تفترض إمكان سحق المستحضر معدل التحرر أو استبداله دون الرجوع إلى نشرته."}, {"id": 20, "en": "Targeted Delivery and Biotechnology", "ar": "التوصيل الموجّه والتقنيات الحيوية", "start": 615, "end": 633, "ex": "Explore drug carriers, targeted delivery and the special kinetics of biological medicines.", "ax": "استكشف حوامل الأدوية والتوصيل الموجه والحرائك الخاصة بالأدوية الحيوية.", "ey": "Biologic medicines may require models that differ from small-molecule drugs.", "ay": "قد تتطلب الأدوية الحيوية نماذج تختلف عن الأدوية صغيرة الجزيئات."}, {"id": 21, "en": "Pharmacokinetics–Pharmacodynamics Relationship", "ar": "العلاقة بين الحرائك والتأثير الدوائي", "start": 635, "end": 678, "ex": "Relate concentration-time profiles to onset, intensity, duration and toxicity of response.", "ax": "اربط منحنى التركيز والزمن ببداية التأثير وشدته ومدته وسميته.", "ey": "Concentration and effect may not track instantaneously because of effect-site delay.", "ay": "قد يتأخر التأثير عن التركيز بسبب تأخر الوصول إلى موقع الفعل."}, {"id": 22, "en": "Clinical Applications of Pharmacokinetics", "ar": "التطبيقات السريرية للحرائك", "start": 681, "end": 732, "ex": "Apply therapeutic drug monitoring, dose individualization, drug interactions and special-population considerations.", "ax": "طبّق مراقبة تراكيز الأدوية وتفريد الجرعات والتداخلات الدوائية واعتبارات الفئات الخاصة.", "ey": "Clinical decisions require patient context, measured concentrations and validated protocols.", "ay": "تتطلب القرارات السريرية بيانات المريض والتركيز المقاس وبروتوكولات معتمدة."}, {"id": 23, "en": "Geriatric, Obese and Pediatric Populations", "ar": "المسنون والسمنة والأطفال", "start": 735, "end": 773, "ex": "Recognize how age, body composition and maturation can alter volume and clearance.", "ax": "تعرّف إلى أثر العمر وتركيب الجسم والنضج في حجم التوزيع والتصفية.", "ey": "Simple weight scaling does not fit every drug or population.", "ay": "لا يصلح تعديل الجرعة بالوزن وحده لكل دواء أو فئة."}, {"id": 24, "en": "Dose Adjustment in Renal and Hepatic Disease", "ar": "تعديل الجرعات في أمراض الكلى والكبد", "start": 775, "end": 815, "ex": "Study organ impairment, estimated kidney function and the limits of dosing formulas.", "ax": "ادرس قصور الأعضاء وتقدير الوظيفة الكلوية وحدود معادلات الجرعات.", "ey": "Never use a classroom calculator as a prescribing instruction for organ impairment.", "ay": "لا تستخدم الحاسبة التعليمية لوصف الجرعات لدى مرضى قصور الأعضاء."}, {"id": 25, "en": "Empirical and Mechanistic Models; NCA", "ar": "النماذج التجريبية والآلية والتحليل غير الحجري", "start": 817, "end": 848, "ex": "Compare compartmental models, physiologically based models, moments and noncompartmental analysis.", "ax": "قارن النماذج الحجرية والفسيولوجية والعزوم والتحليل غير الحجري.", "ey": "AUC can be estimated by trapezoidal integration; model choice depends on the scientific question.", "ay": "يمكن تقدير AUC بالتكامل شبه المنحرف؛ ويعتمد اختيار النموذج على السؤال العلمي."}];
const originalChapter4="<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Pharmacokinetics | الحرائك الدوائية — Chapter 4<\/title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:system-ui,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#102b4b;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 18px;box-shadow:0 3px 14px #0002}header strong{font-size:clamp(13px,2.5vw,19px)}.switch{display:flex;gap:7px}button{border:1px solid #aac8e8;background:#fff;color:#173b61;border-radius:9px;padding:10px 17px;cursor:pointer;font-weight:700}button[aria-pressed=\"true\"]{background:#2b8cde;color:white;border-color:#2b8cde}iframe{display:block;border:0;width:100%;height:calc(100dvh - 65px);background:white}iframe[hidden]{display:none} @media(max-width:500px){header{padding:7px;flex-wrap:wrap;justify-content:center}iframe{height:calc(100dvh - 100px)}} <\/style><\/head><body><header><strong id=\"heading\">الفصل الرابع | Chapter 4 — IV Bolus<\/strong><div class=\"switch\" role=\"group\" aria-label=\"Language / اللغة\"><button id=\"arBtn\" type=\"button\" aria-pressed=\"true\" onclick=\"switchLang('ar')\">العربية<\/button><button id=\"enBtn\" type=\"button\" aria-pressed=\"false\" onclick=\"switchLang('en')\">English<\/button><\/div><\/header><iframe id=\"arabic\" title=\"النسخة العربية\" srcdoc=\"&lt;!doctype html&gt;&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;مختبر الحرائك الدوائية | الفصل الرابع&lt;/title&gt;&lt;style&gt;:root{--bg:#f3f7fb;--ink:#152b44;--blue:#1465b8;--line:#d9e5f0;--green:#147d69}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,&#x27;Segoe UI&#x27;,sans-serif;color:var(--ink);line-h &lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;h1&gt;مختبر الحرائك الدوائية التفاعلي&lt;/h1&gt;&lt;p&gt;One-Compartment Open Model — Intravenous Bolus Administration&lt;/p&gt;&lt;p&gt;الفصل الرابع | الصفحات 75–96 | Shargel &amp; Yu, 7th Edition&lt;/p&gt;&lt;/header&gt;&lt;nav id=&quot;nav&quot;&gt;&lt;button class=&quot;active&quot; data-tab=&quot;lessons&quot;&gt;الدروس&lt;/button&gt;&lt;button data-tab=&quot;sim&quot;&gt;المحاكاة&lt;/button&gt;&lt;button data-tab=&quot;calc&quot;&gt;الحاسبات&lt;/button&gt;&lt;button data-tab=&quot;cases&quot;&gt;حالات سريرية&lt;/button&gt;&lt;button data-tab=&quot;urine&quot;&gt;الإطراح البولي&lt;/button&gt;&lt;button data-tab=&quot;quiz&quot;&gt;الاختبار&lt;/button&gt;&lt;/nav&gt;&lt;main&gt;&lt;section id=&quot;lessons&quot; class=&quot;panel active&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;خريطة الفصل&lt;/h2&gt;&lt;p&gt;هذه مادة تعليمية أصلية مستندة إلى موضوعات الفصل الرابع، وليست نسخة من نص الكتاب. تشرح نموذج الحجرة الواحدة عند إعطاء جرعة وريدية دفعة واحدة، وتربط الرياضيات بالتفسير الصيدلاني.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;تنبيه: جميع الحالات والجرعات والأرقام في المحاكاة افتراضية للتعليم فقط، وليست إرشادات لإعطاء دواء لمريض.&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;lessonCards&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sim&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;محاكاة تركيز الدواء في البلازما&lt;/h2&gt;&lt;p&gt;غيّر المعاملات وشاهد كيف ينخفض تركيز الدواء بعد جرعة IV bolus، مع افتراض التوزع الفوري والإطراح من الرتبة الأولى.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;الجرعة (mg)&lt;/label&gt;&lt;input id=&quot;dose&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;5000&quot; value=&quot;500&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;حجم التوزيع Vd (L)&lt;/label&gt;&lt;input id=&quot;vd&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;500&quot; step=&quot;0.1&quot; value=&quot;40&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;ثابت الإطراح k (h⁻¹)&lt;/label&gt;&lt;input id=&quot;k&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;5&quot; step=&quot;0.01&quot; value=&quot;0.2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;الزمن المراد حسابه (h)&lt;/label&gt;&lt;input id=&quot;t&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;240&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot; id=&quot;simStats&quot; style=&quot;margin:16px 0&quot;&gt;&lt;/div&gt;&lt;canvas id=&quot;chart&quot; width=&quot;1000&quot; height=&quot;360&quot; aria-label=&quot;منحنى التركيز مع الزمن&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;small muted&quot;&gt;المحور الأفقي: الزمن بالساعات؛ العمودي: تركيز البلازما mg/L. الخط المتقطع يشير إلى الزمن المختار.&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;C(t) = (Dose / Vd) × e&lt;sup&gt;−kt&lt;/sup&gt;&lt;/div&gt;&lt;p id=&quot;interpret&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;calc&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;حاسبة المعاملات الأساسية&lt;/h2&gt;&lt;p&gt;أدخل ثلاث قيم معروفة واحسب المشتقات. في هذا القسم نستخدم Dose و C₀ و k؛ ثم نحسب Vd و CL و t½ و AUC.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Dose (mg)&lt;/label&gt;&lt;input id=&quot;cd&quot; type=&quot;number&quot; value=&quot;400&quot; min=&quot;0.01&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₀ (mg/L)&lt;/label&gt;&lt;input id=&quot;cc&quot; type=&quot;number&quot; value=&quot;10&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;k (h⁻¹)&lt;/label&gt;&lt;input id=&quot;ck&quot; type=&quot;number&quot; value=&quot;0.1733&quot; min=&quot;0.00001&quot; step=&quot;0.0001&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;calculate()&quot; style=&quot;margin:12px 0&quot;&gt;احسب واشرح&lt;/button&gt;&lt;div id=&quot;calcResult&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;استخراج k من قياسين&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₁ (mg/L)&lt;/label&gt;&lt;input id=&quot;c1&quot; type=&quot;number&quot; value=&quot;12&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₂ (mg/L)&lt;/label&gt;&lt;input id=&quot;c2&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;t₁ (h)&lt;/label&gt;&lt;input id=&quot;t1&quot; type=&quot;number&quot; value=&quot;2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;t₂ (h)&lt;/label&gt;&lt;input id=&quot;t2&quot; type=&quot;number&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;twoPoints()&quot; class=&quot;primary&quot; style=&quot;margin:12px 0&quot;&gt;استخرج الميل والثابت&lt;/button&gt;&lt;div id=&quot;twoResult&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;cases&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;محاكاة حالات من الممارسة الصيدلانية&lt;/h2&gt;&lt;p&gt;حالات افتراضية مستوحاة من مواقف سريرية واقعية؛ الهدف تفسير البيانات لا اتخاذ قرارات علاجية.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;button onclick=&quot;loadCase(0)&quot;&gt;حالة 1: متابعة التركيز&lt;/button&gt;&lt;button onclick=&quot;loadCase(1)&quot;&gt;حالة 2: تغير التصفية&lt;/button&gt;&lt;button onclick=&quot;loadCase(2)&quot;&gt;حالة 3: اختلاف Vd&lt;/button&gt;&lt;/div&gt;&lt;div id=&quot;caseView&quot; style=&quot;margin-top:16px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;urine&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;حساب ثابت الإطراح من بيانات البول&lt;/h2&gt;&lt;p&gt;إذا كانت كمية الدواء المطروحة دون تغيير في البول عند الزمن t هي &lt;span class=&quot;ltr&quot;&gt;Ae(t)&lt;/span&gt;، وكان الطرح الكلي النهائي &lt;span class=&quot;ltr&quot;&gt;Ae∞&lt;/span&gt;، فإن:&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;Ae∞ − Ae(t) = Ae∞ × e&lt;sup&gt;−kt&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;وباستخدام قياسين للكمية المتبقية للطرح نحصل على k. تتطلب الطريقة جمعًا بوليًا كاملًا ودواءً يُطرح دون تغيير واتباع افتراضات النموذج.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae∞ (mg)&lt;/label&gt;&lt;input id=&quot;aeinf&quot; type=&quot;number&quot; value=&quot;200&quot; min=&quot;0.01&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae عند الزمن الأول (mg)&lt;/label&gt;&lt;input id=&quot;ae1&quot; type=&quot;number&quot; value=&quot;80&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae عند الزمن الثاني (mg)&lt;/label&gt;&lt;input id=&quot;ae2&quot; type=&quot;number&quot; value=&quot;140&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;الزمن الأول (h)&lt;/label&gt;&lt;input id=&quot;ut1&quot; type=&quot;number&quot; value=&quot;2&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;الزمن الثاني (h)&lt;/label&gt;&lt;input id=&quot;ut2&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;urineCalc()&quot; style=&quot;margin:12px 0&quot;&gt;احسب k&lt;/button&gt;&lt;div id=&quot;urineResult&quot;&gt;&lt;/div&gt;&lt;h3&gt;ملاحظة مهمة&lt;/h3&gt;&lt;p&gt;يميز الفصل بين ثابت الإطراح الكلي &lt;span class=&quot;ltr&quot;&gt;k&lt;/span&gt; وثابت الإطراح الكلوي للدواء غير المتغير &lt;span class=&quot;ltr&quot;&gt;ke&lt;/span&gt;؛ لا يجوز مساواتهما إلا إذا كان الإطراح الكلوي هو المسار الوحيد.&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;Ae∞ = (ke / k) × Dose &amp;nbsp; ⇒ &amp;nbsp; ke = k × Ae∞ / Dose&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;quiz&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;اختبار الفهم والتطبيق&lt;/h2&gt;&lt;p&gt;اختر إجابة واحدة لكل سؤال. ستظهر النتيجة مع شرح علمي لكل إجابة.&lt;/p&gt;&lt;div id=&quot;questions&quot;&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;grade()&quot;&gt;تصحيح الاختبار&lt;/button&gt;&lt;button onclick=&quot;resetQuiz()&quot;&gt;إعادة المحاولة&lt;/button&gt;&lt;div id=&quot;score&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;محتوى تعليمي مستقل مستند إلى الفصل 4 (ص 75–96) — للاستخدام الأكاديمي فقط، وليس لاتخاذ قرارات علاجية.&lt;/footer&gt;&lt;script&gt;\nconst lessons=[[&#x27;مقدمة وافتراضات النموذج — ص 75–76&#x27;,&#x27;نموذج الحجرة الواحدة المفتوح يفترض أن الجرعة الوريدية تدخل الجسم مباشرة وبالكامل، وأن الدواء يتوزع بسرعة كافية ليُعامل الجسم كحجرة متجانسة واحدة. كلمة «مفتوح» تعني أن الدواء يستطيع مغادرة الجسم بالإطراح أو الاستقلاب. يصف النموذج تركيز البلازما ولا يساوي بالضرورة تركيز كل نسيج.&#x27;,&#x27;IV bolus → rapid mixing → first-order elimination&#x27;,&#x27;لا يكون النموذج مناسبًا عندما يظهر طور توزيع واضح متعدد المراحل أو عندما تكون الحرائك غير خطية.&#x27;],[&#x27;ثابت الإطراح Elimination Rate Constant — ص 76&#x27;,&#x27;في الإطراح من الرتبة الأولى، يتناسب معدل زوال الدواء مع الكمية الموجودة في الجسم. الثابت k وحدته مقلوب الزمن، مثل h⁻¹. عند ثبات k تنخفض نسبة ثابتة من الكمية خلال كل فترة زمنية متساوية، لا كمية ثابتة.&#x27;,&#x27;dA/dt = −kA  |  A(t) = A₀ e^(−kt)  |  C(t) = C₀ e^(−kt)&#x27;,&#x27;إذا كان k=0.2 h⁻¹، فالنسبة الباقية بعد 5 ساعات هي e^(−1) ≈ 36.8%.&#x27;],[&#x27;نصف العمر والرسم شبه اللوغاريتمي — ص 76–77&#x27;,&#x27;نصف العمر t½ هو الزمن اللازم لانخفاض التركيز إلى النصف. في نموذج الرتبة الأولى يبقى ثابتًا بغض النظر عن التركيز الابتدائي. عند رسم ln(C) مقابل الزمن ينتج خط مستقيم ميله −k. وإذا استُخدم log10 يصبح الميل −k/2.303.&#x27;,&#x27;t½ = 0.693/k  |  ln(C) = ln(C₀) − kt&#x27;,&#x27;يُستخدم الميل لاستخراج k من عينات البلازما، بشرط أن تكون العينات ضمن طور الإطراح المناسب.&#x27;],[&#x27;حجم التوزيع الظاهري Vd — ص 77–80&#x27;,&#x27;حجم التوزيع هو ثابت تناسب يربط كمية الدواء في الجسم بتركيزه المقاس في البلازما. بعد IV bolus يكون C₀ = Dose/Vd. يسمى ظاهريًا لأنه ليس حجمًا تشريحيًا حقيقيًا؛ وقد يتجاوز حجم سوائل الجسم عند ارتباط الدواء بالأنسجة.&#x27;,&#x27;Vd = Dose/C₀  |  C₀ = Dose/Vd&#x27;,&#x27;لنفس الجرعة: Vd الأكبر يعني تركيزًا أوليًا أقل. لا يمكن استنتاج حجم عضو أو حجرة فعلية مباشرة من Vd.&#x27;],[&#x27;التصفية Clearance — ص 80–85&#x27;,&#x27;التصفية CL هي الحجم الافتراضي من البلازما الذي يُزال منه الدواء بالكامل في وحدة الزمن. في هذا النموذج CL = k×Vd. وهي تختلف عن كمية الدواء المطرودة في الساعة؛ فمعدل الإزالة يتغير مع التركيز بينما CL تبقى ثابتة عند الخطية.&#x27;,&#x27;CL = k × Vd  |  Rate of elimination = CL × C&#x27;,&#x27;إذا كان Vd=40 L وk=0.2 h⁻¹ فإن CL=8 L/h.&#x27;],[&#x27;المساحة تحت المنحنى AUC — ص 80–85&#x27;,&#x27;تمثل AUC التعرض الكلي لتركيز الدواء مع الزمن بعد جرعة واحدة. لنموذج IV bolus الخطي من صفر إلى ما لا نهاية: AUC=C₀/k=Dose/CL. وحدتها مثل mg·h/L.&#x27;,&#x27;AUC₀–∞ = C₀/k = Dose/CL&#x27;,&#x27;إذا انخفضت CL مع بقاء الجرعة نفسها، تزداد AUC؛ ولا يعني ذلك وحده تحديد جرعة مناسبة لمريض.&#x27;],[&#x27;التطبيقات السريرية — ص 85 و89&#x27;,&#x27;يُستخدم النموذج في تفسير عينات الدم وتقدير المعاملات الدوائية وفهم أثر تغير التصفية أو حجم التوزيع. في الواقع تتأثر المعاملات بوظائف الأعضاء والعمر والحالة المرضية والدواء؛ ويلزم التحقق من صلاحية النموذج وتوقيت العينات.&#x27;,&#x27;C(t) = (Dose/Vd) × e^(−CL·t/Vd)&#x27;,&#x27;القياسات السريرية وتوصيات الجرعات تحتاج بيانات دوائية معتمدة وتقييم اختصاصي.&#x27;],[&#x27;الإطراح البولي — ص 86–89&#x27;,&#x27;يمكن تقدير ثابت الإطراح من تغير كمية الدواء غير المتغير في البول. في طريقة sigma-minus نرسم لوغاريتم الكمية المتبقية للطرح Ae∞−Ae(t) مقابل الزمن؛ الميل يحدد k. ويمكن كذلك دراسة معدل الطرح البولي عبر فترات جمع متتابعة.&#x27;,&#x27;ln[Ae∞ − Ae(t)] = ln(Ae∞) − kt&#x27;,&#x27;جمع البول الناقص أو تقدير Ae∞ غير الصحيح يؤديان إلى نتائج مضللة.&#x27;],[&#x27;المراجعة والمسائل — ص 87–96&#x27;,&#x27;تجمع نهاية الفصل مسائل تطبيقية وأسئلة تعلم وإجابات ومراجع. راجع دائمًا الوحدات: mg للجرعة، mg/L للتركيز، L لـ Vd، h⁻¹ لـ k، L/h للتصفية، وh لنصف العمر.&#x27;,&#x27;Dose = C₀ × Vd  |  k = ln(C₁/C₂)/(t₂−t₁)&#x27;,&#x27;ابدأ بالمعطيات ثم القانون ثم التعويض ثم الوحدة، وراجع معقولية النتيجة.&#x27;]];\ndocument.getElementById(&#x27;lessonCards&#x27;).innerHTML=lessons.map((x,i)=&gt;`&lt;article class=&quot;card&quot;&gt;&lt;h2&gt;${i+1}. ${x[0]}&lt;/h2&gt;&lt;p&gt;${x[1]}&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;${x[2]}&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;${x[3]}&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;);\ndocument.querySelectorAll(&#x27;nav button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{document.querySelectorAll(&#x27;nav button,.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));b.classList.add(&#x27;active&#x27;);document.getElementById(b.dataset.tab).classList.add(&#x27;active&#x27;);if(b.dataset.tab===&#x27;sim&#x27;)simulate()});const v=id=&gt;Number(document.getElementById(id).value),f=(x,n=3)=&gt;Number.isFinite(x)?x.toFixed(n):&#x27;—&#x27;;const ok=(...a)=&gt;a.every(x=&gt;Number.isFinite(x)&amp;&amp;x&gt;0);function simulate(){let d=v(&#x27;dose&#x27;),V=v(&#x27;vd&#x27;),k=v(&#x27;k&#x27;),t=v(&#x27;t&#x27;);if(!ok(d,V,k)||t&lt;0||!Number.isFinite(t)){document.getElementById(&#x27;simStats&#x27;).innerHTML=&#x27;أدخل قيمًا موجبة وصحيحة.&#x27;;return}let c0=d/V,c=c0*Math.exp(-k*t),half=Math.log(2)/k,cl=k*V;document.getElementById(&#x27;simStats&#x27;).innerHTML=[[&#x27;C₀&#x27;,f(c0)+&#x27; mg/L&#x27;],[&#x27;C(t)&#x27;,f(c)+&#x27; mg/L&#x27;],[&#x27;Half-life&#x27;,f(half)+&#x27; h&#x27;],[&#x27;Clearance&#x27;,f(cl)+&#x27; L/h&#x27;],[&#x27;AUC&#x27;,f(d/cl)+&#x27; mg·h/L&#x27;]].map(a=&gt;`&lt;div class=&quot;stat&quot;&gt;${a[0]}&lt;strong&gt;${a[1]}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);document.getElementById(&#x27;interpret&#x27;).textContent=`بعد ${f(t,1)} ساعة يبقى ${f(100*Math.exp(-k*t),1)}% من التركيز الابتدائي. زيادة الجرعة ترفع المنحنى، وزيادة k تسرّع انخفاضه.`;let canvas=document.getElementById(&#x27;chart&#x27;),ctx=canvas.getContext(&#x27;2d&#x27;),W=canvas.width,H=canvas.height,p=65,maxT=Math.max(12,half*5,t*1.2),x=z=&gt;p+(W-p-25)*z/maxT,y=z=&gt;H-p-(H-p-30)*z/c0;ctx.clearRect(0,0,W,H);ctx.strokeStyle=&#x27;#d8e5ef&#x27;;ctx.lineWidth=1;for(let i=0;i&lt;=5;i++){let yy=y(c0*i/5);ctx.beginPath();ctx.moveTo(p,yy);ctx.lineTo(W-25,yy);ctx.stroke();ctx.fillStyle=&#x27;#506b82&#x27;;ctx.font=&#x27;15px sans-serif&#x27;;ctx.fillText(f(c0*i/5,1),6,yy+5)}for(let i=0;i&lt;=6;i++){let xx=x(maxT*i/6);ctx.beginPath();ctx.moveTo(xx,30);ctx.lineTo(xx,H-p);ctx.stroke();ctx.fillText(f(maxT*i/6,1),xx-12,H-22)}ctx.beginPath();ctx.strokeStyle=&#x27;#1166b4&#x27;;ctx.lineWidth=4;for(let i=0;i&lt;=250;i++){let z=maxT*i/250; i?ctx.lineTo(x(z),y(c0*Math.exp(-k*z))):ctx.moveTo(x(z),y(c0))}ctx.stroke();ctx.setLineDash([7,6]);ctx.strokeStyle=&#x27;#c35e2b&#x27;;ctx.beginPath();ctx.moveTo(x(t),H-p);ctx.lineTo(x(t),y(c));ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.fillStyle=&#x27;#c35e2b&#x27;;ctx.arc(x(t),y(c),6,0,Math.PI*2);ctx.fill()}[&#x27;dose&#x27;,&#x27;vd&#x27;,&#x27;k&#x27;,&#x27;t&#x27;].forEach(id=&gt;document.getElementById(id).addEventListener(&#x27;input&#x27;,simulate));function calculate(){let d=v(&#x27;cd&#x27;),c=v(&#x27;cc&#x27;),k=v(&#x27;ck&#x27;),el=document.getElementById(&#x27;calcResult&#x27;);if(!ok(d,c,k)){el.textContent=&#x27;القيم الثلاث يجب أن تكون موجبة.&#x27;;return}let V=d/c,cl=k*V;el.innerHTML=`&lt;div class=&quot;grid&quot;&gt;${[[&#x27;Vd&#x27;,f(V)+&#x27; L&#x27;],[&#x27;CL&#x27;,f(cl)+&#x27; L/h&#x27;],[&#x27;t½&#x27;,f(.693147/k)+&#x27; h&#x27;],[&#x27;AUC&#x27;,f(c/k)+&#x27; mg·h/L&#x27;]].map(a=&gt;`&lt;div class=&quot;stat&quot;&gt;${a[0]}&lt;strong&gt;${a[1]}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;خطوات الحل: Vd = Dose/C₀ = ${f(d)}/${f(c)} = ${f(V)} L. ثم CL = k×Vd = ${f(k)}×${f(V)} = ${f(cl)} L/h. ونصف العمر = 0.693/k.&lt;/p&gt;`}function twoPoints(){let a=v(&#x27;c1&#x27;),b=v(&#x27;c2&#x27;),t1=v(&#x27;t1&#x27;),t2=v(&#x27;t2&#x27;),el=document.getElementById(&#x27;twoResult&#x27;);if(!ok(a,b)||t2&lt;=t1||b&gt;=a){el.textContent=&#x27;يشترط أن t₂ &gt; t₁ وأن 0 &lt; C₂ &lt; C₁.&#x27;;return}let k=Math.log(a/b)/(t2-t1);el.innerHTML=`&lt;div class=&quot;stat&quot;&gt;k = &lt;strong&gt;${f(k,5)} h⁻¹&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;k = ln(${a}/${b}) / (${t2}−${t1}). نصف العمر = ${f(.693147/k)} h؛ وC₀ المستنتج = ${f(a*Math.exp(k*t1))} mg/L.&lt;/p&gt;`}\nconst cases=[{name:&#x27;متابعة تركيز بعد IV bolus&#x27;,d:500,V:50,k:.1733,t:4,question:&#x27;ماذا تتوقع لتركيز الدواء بعد أربع ساعات؟&#x27;,answer:&#x27;C₀ = 500/50 = 10 mg/L؛ وبعد 4 ساعات ≈ 5 mg/L، أي نصف التركيز تقريبًا لأن t½ ≈ 4 ساعات.&#x27;},{name:&#x27;انخفاض التصفية مع ثبات Vd&#x27;,d:400,V:40,k:.1,t:6,question:&#x27;كيف تختلف النتائج إذا كان k سابقًا 0.2 h⁻¹ وأصبح 0.1 h⁻¹؟&#x27;,answer:&#x27;تنخفض CL من 8 إلى 4 L/h، ويتضاعف نصف العمر تقريبًا من 3.47 إلى 6.93 ساعة، وتتضاعف AUC للجرعة نفسها. لا يُستنتج تعديل جرعة سريري من هذه الأرقام وحدها.&#x27;},{name:&#x27;زيادة حجم التوزيع مع ثبات التصفية&#x27;,d:400,V:80,k:.1,t:4,question:&#x27;قارن بحالة Vd=40 L وCL=8 L/h.&#x27;,answer:&#x27;عند Vd=80 L وCL=8 L/h يصبح k=0.1 h⁻¹ وC₀=5 mg/L بدل 10 mg/L؛ ويطول نصف العمر. AUC تبقى 50 mg·h/L إذا ظلت CL والجرعة ثابتتين.&#x27;}];function loadCase(i){let a=cases[i];document.getElementById(&#x27;caseView&#x27;).innerHTML=`&lt;h3&gt;${a.name}&lt;/h3&gt;&lt;p&gt;جرعة افتراضية ${a.d} mg، حجم توزيع ${a.V} L، ثابت إطراح ${a.k} h⁻¹.&lt;/p&gt;&lt;p&gt;&lt;b&gt;سؤال للصيدلي المتدرب:&lt;/b&gt; ${a.question}&lt;/p&gt;&lt;button onclick=&quot;document.getElementById(&#x27;caseAnswer&#x27;).hidden=false&quot;&gt;أظهر التحليل&lt;/button&gt;&lt;div id=&quot;caseAnswer&quot; hidden class=&quot;note&quot; style=&quot;margin-top:10px&quot;&gt;${a.answer}&lt;/div&gt;&lt;button onclick=&quot;document.getElementById(&#x27;dose&#x27;).value=${a.d};document.getElementById(&#x27;vd&#x27;).value=${a.V};document.getElementById(&#x27;k&#x27;).value=${a.k};document.getElementById(&#x27;t&#x27;).value=${a.t};document.querySelector(&#x27;[data-tab=sim]&#x27;).click()&quot; class=&quot;primary&quot;&gt;افتح هذه الحالة في المحاكاة&lt;/button&gt;`}loadCase(0);function urineCalc(){let inf=v(&#x27;aeinf&#x27;),a=v(&#x27;ae1&#x27;),b=v(&#x27;ae2&#x27;),t1=v(&#x27;ut1&#x27;),t2=v(&#x27;ut2&#x27;),el=document.getElementById(&#x27;urineResult&#x27;);if(!ok(inf)||a&lt;0||b&lt;=a||b&gt;=inf||t2&lt;=t1){el.textContent=&#x27;تأكد أن 0 ≤ Ae₁ &lt; Ae₂ &lt; Ae∞ وأن t₂ &gt; t₁.&#x27;;return}let k=Math.log((inf-a)/(inf-b))/(t2-t1);el.innerHTML=`&lt;div class=&quot;stat&quot;&gt;k = &lt;strong&gt;${f(k,5)} h⁻¹&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;الكمية المتبقية أولًا ${f(inf-a)} mg، وثانيًا ${f(inf-b)} mg؛ إذن k = ln[${f(inf-a)}/${f(inf-b)}] / (${t2}−${t1}). نصف العمر ≈ ${f(.693147/k)} h.&lt;/p&gt;`}\nconst questions=[[&#x27;ما المقصود بكلمة Open في النموذج؟&#x27;,[&#x27;وجود امتصاص فموي&#x27;,&#x27;إمكان خروج الدواء من الجسم&#x27;,&#x27;وجود حجرتين&#x27;],1,&#x27;يعني أن الدواء يدخل الحجرة ويغادرها بالإطراح أو الاستقلاب.&#x27;],[&#x27;ما وحدة k؟&#x27;,[&#x27;L/h&#x27;,&#x27;mg/L&#x27;,&#x27;h⁻¹&#x27;],2,&#x27;ثابت الإطراح من الرتبة الأولى وحدته مقلوب الزمن.&#x27;],[&#x27;إذا كان k = 0.231 h⁻¹ فكم نصف العمر تقريبًا؟&#x27;,[&#x27;3 h&#x27;,&#x27;6 h&#x27;,&#x27;0.33 h&#x27;],0,&#x27;0.693/0.231 = 3 ساعات.&#x27;],[&#x27;جرعة 200 mg وC₀ = 5 mg/L. ما Vd؟&#x27;,[&#x27;40 L&#x27;,&#x27;1000 L&#x27;,&#x27;0.025 L&#x27;],0,&#x27;Vd = 200/5 = 40 L.&#x27;],[&#x27;إذا كان Vd=30 L وk=0.2 h⁻¹ فما CL؟&#x27;,[&#x27;150 L/h&#x27;,&#x27;6 L/h&#x27;,&#x27;30.2 L/h&#x27;],1,&#x27;CL=k×Vd=6 L/h.&#x27;],[&#x27;أي عبارة صحيحة عن Vd؟&#x27;,[&#x27;حجم تشريحي مباشر&#x27;,&#x27;لا يمكن أن يتجاوز ماء الجسم&#x27;,&#x27;حجم ظاهري مستنتج من كمية الدواء والتركيز&#x27;],2,&#x27;هو ثابت تناسب وليس قياسًا تشريحيًا.&#x27;],[&#x27;بعد مرور نصفَي عمر، ما النسبة المتبقية؟&#x27;,[&#x27;25%&#x27;,&#x27;50%&#x27;,&#x27;75%&#x27;],0,&#x27;بعد نصفين: 1/2 × 1/2 = 1/4.&#x27;],[&#x27;ماذا يحدث لـ C₀ إذا تضاعفت الجرعة وبقي Vd ثابتًا؟&#x27;,[&#x27;يتضاعف&#x27;,&#x27;ينخفض للنصف&#x27;,&#x27;لا يتغير&#x27;],0,&#x27;C₀=Dose/Vd.&#x27;],[&#x27;ما العلاقة الصحيحة لـ AUC بعد IV bolus خطي؟&#x27;,[&#x27;CL/Dose&#x27;,&#x27;Dose/CL&#x27;,&#x27;Dose×CL&#x27;],1,&#x27;AUC = Dose/CL.&#x27;],[&#x27;ميل ln(C) مقابل الزمن يساوي:&#x27;,[&#x27;−k&#x27;,&#x27;k/2&#x27;,&#x27;−Vd&#x27;],0,&#x27;من ln C = ln C₀ − kt.&#x27;],[&#x27;إذا انخفضت CL للنصف وبقيت الجرعة ثابتة، ماذا يحدث لـ AUC؟&#x27;,[&#x27;تنخفض للنصف&#x27;,&#x27;تتضاعف&#x27;,&#x27;تبقى ثابتة&#x27;],1,&#x27;AUC=Dose/CL.&#x27;],[&#x27;ما أهم قيد في طريقة sigma-minus البولية؟&#x27;,[&#x27;لا حاجة لجمع كامل&#x27;,&#x27;لا حاجة لمعرفة Ae∞&#x27;,&#x27;الحاجة لتقدير Ae∞ وجمع بول موثوق&#x27;],2,&#x27;تتطلب معرفة الكمية النهائية والقياسات الدقيقة.&#x27;],[&#x27;هل k يساوي ke دائمًا؟&#x27;,[&#x27;نعم&#x27;,&#x27;لا، إلا في شروط خاصة&#x27;,&#x27;فقط عند الجرعات الكبيرة&#x27;],1,&#x27;k يشمل مسارات الإزالة المختلفة.&#x27;],[&#x27;لماذا لا يصلح النموذج لكل الأدوية؟&#x27;,[&#x27;قد يظهر توزيع متعدد الأطوار&#x27;,&#x27;لأن جميع الأدوية تمتص فمويًا&#x27;,&#x27;لأن الإطراح دائمًا صفري&#x27;],0,&#x27;التوزع متعدد الحجرات أو عدم الخطية قد يخرقان الافتراضات.&#x27;],[&#x27;تركيز 8 mg/L أصبح 4 mg/L خلال ساعتين. ما k؟&#x27;,[&#x27;0.347 h⁻¹&#x27;,&#x27;2 h⁻¹&#x27;,&#x27;4 h⁻¹&#x27;],0,&#x27;k=ln(2)/2 ≈ 0.347 h⁻¹.&#x27;]];function renderQuiz(){document.getElementById(&#x27;questions&#x27;).innerHTML=questions.map((q,i)=&gt;`&lt;div class=&quot;q&quot;&gt;&lt;b&gt;${i+1}. ${q[0]}&lt;/b&gt;${q[1].map((o,j)=&gt;`&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q${i}&quot; value=&quot;${j}&quot; style=&quot;width:auto&quot;&gt; ${o}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;div id=&quot;fb${i}&quot; class=&quot;small&quot;&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}function grade(){let score=0;questions.forEach((q,i)=&gt;{let selected=document.querySelector(`input[name=q${i}]:checked`),correct=selected&amp;&amp;Number(selected.value)===q[2];if(correct)score++;document.getElementById(&#x27;fb&#x27;+i).innerHTML=`&lt;span class=&quot;${correct?&#x27;good&#x27;:&#x27;bad&#x27;}&quot;&gt;${correct?&#x27;صحيح&#x27;:&#x27;الإجابة الصحيحة: &#x27;+q[1][q[2]]}&lt;/span&gt; — ${q[3]}`});document.getElementById(&#x27;score&#x27;).innerHTML=`&lt;h3&gt;النتيجة: ${score} / ${questions.length} (${f(score/questions.length*100,0)}%)&lt;/h3&gt;`}function resetQuiz(){renderQuiz();document.getElementById(&#x27;score&#x27;).innerHTML=&#x27;&#x27;}renderQuiz();calculate();twoPoints();simulate();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\n\" loading=\"eager\"><\/iframe><iframe id=\"english\" title=\"English version\" srcdoc=\"&lt;!doctype html&gt;&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;مختبر الحرائك الدوائية | الفصل الرابع&lt;/title&gt;&lt;style&gt;:root{--bg:#f3f7fb;--ink:#152b44;--blue:#1465b8;--line:#d9e5f0;--green:#147d69}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,&#x27;Segoe UI&#x27;,sans-serif;color:var(--ink);line-height:1.8}header{background:linear-gradient(110deg,#0b2543,#1465b8);color:white;padding:30px max(18px,5vw)}header h1{margin:0;font-size:clamp(23px,3vw,38px)}header p{margin:8px 0}nav{display:flex;gap:9px;overflow:auto;padding:14px 5vw;background:white;position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #15325214}button{cursor:pointer;border:0;border-radius:10px;padding:10px 17px;font:inherit;background:#e7f0fa;color:#164b7b}button.active,button.primary{background:var(--blue);color:white}main{max-width:1160px;margin:24px auto;padding:0 16px}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:16px;box-shadow:0 4px 14px #12345209}h2{color:#125492;margin-top:0}h3{color:#17649a;margin-bottom:5px}.eq{direction:ltr;text-align:center;background:#eef5ff;border-radius:10px;padding:13px;font:600 20px Georgia,serif;overflow:auto}.muted{color:#5e7185}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}input,select{padding:10px;border:1px solid #b9cde0;border-radius:9px;font:inherit;width:100%;background:white}label{font-weight:600}.stat{background:#edf7ff;padding:14px;border-radius:12px}.stat strong{display:block;font-size:23px;direction:ltr;text-align:left;color:#105c9f}canvas{width:100%;height:310px;border:1px solid var(--line);border-radius:12px;background:white}.note{border-left:4px solid #e8a42d;background:#fff8e8;padding:12px;border-radius:7px}.good{color:#087b58}.bad{color:#b43c3c}.q{border-top:1px solid var(--line);padding:14px 0}.q label{display:block;font-weight:400;padding:3px}.small{font-size:13px}footer{text-align:center;padding:24px;color:#667}.ltr{direction:ltr;display:inline-block}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}@media(max-width:600px){header{padding:22px}nav{padding:10px}canvas{height:260px}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;h1&gt;Interactive Pharmacokinetics Lab&lt;/h1&gt;&lt;p&gt;One-Compartment Open Model — Intravenous Bolus Administration&lt;/p&gt;&lt;p&gt;Chapter 4 | Pages 75–96 | Shargel &amp; Yu, 7th Edition&lt;/p&gt;&lt;/header&gt;&lt;nav id=&quot;nav&quot;&gt;&lt;button class=&quot;active&quot; data-tab=&quot;lessons&quot;&gt;Lessons&lt;/button&gt;&lt;button data-tab=&quot;sim&quot;&gt;Simulation&lt;/button&gt;&lt;button data-tab=&quot;calc&quot;&gt;Calculators&lt;/button&gt;&lt;button data-tab=&quot;cases&quot;&gt;Clinical Cases&lt;/button&gt;&lt;button data-tab=&quot;urine&quot;&gt;Urinary Excretion&lt;/button&gt;&lt;button data-tab=&quot;quiz&quot;&gt;Quiz&lt;/button&gt;&lt;/nav&gt;&lt;main&gt;&lt;section id=&quot;lessons&quot; class=&quot;panel active&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Chapter Roadmap&lt;/h2&gt;&lt;p&gt;Original educational material based on Chapter 4 topics, not a reproduction of the textbook. It connects one-compartment IV bolus mathematics with pharmaceutical interpretation.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;Educational use only. All simulated doses and clinical scenarios are hypothetical, not patient-specific prescribing guidance.&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;lessonCards&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sim&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Plasma Concentration Simulator&lt;/h2&gt;&lt;p&gt;Adjust the parameters to observe the decline in plasma concentration following an IV bolus under instantaneous mixing and first-order elimination assumptions.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Dose (mg)&lt;/label&gt;&lt;input id=&quot;dose&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;5000&quot; value=&quot;500&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Volume of Distribution Vd (L)&lt;/label&gt;&lt;input id=&quot;vd&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;500&quot; step=&quot;0.1&quot; value=&quot;40&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Elimination Rate Constant k (h⁻¹)&lt;/label&gt;&lt;input id=&quot;k&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;5&quot; step=&quot;0.01&quot; value=&quot;0.2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Evaluation Time (h)&lt;/label&gt;&lt;input id=&quot;t&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;240&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot; id=&quot;simStats&quot; style=&quot;margin:16px 0&quot;&gt;&lt;/div&gt;&lt;canvas id=&quot;chart&quot; width=&quot;1000&quot; height=&quot;360&quot; aria-label=&quot;منحنى التركيز مع الزمن&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;small muted&quot;&gt;Horizontal axis: time in hours. Vertical axis: plasma concentration in mg/L. Dashed line: selected time.&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;C(t) = (Dose / Vd) × e&lt;sup&gt;−kt&lt;/sup&gt;&lt;/div&gt;&lt;p id=&quot;interpret&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;calc&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Basic PK Parameter Calculator&lt;/h2&gt;&lt;p&gt;Enter Dose, C₀ and k to calculate Vd, CL, half-life and AUC.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Dose (mg)&lt;/label&gt;&lt;input id=&quot;cd&quot; type=&quot;number&quot; value=&quot;400&quot; min=&quot;0.01&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₀ (mg/L)&lt;/label&gt;&lt;input id=&quot;cc&quot; type=&quot;number&quot; value=&quot;10&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;k (h⁻¹)&lt;/label&gt;&lt;input id=&quot;ck&quot; type=&quot;number&quot; value=&quot;0.1733&quot; min=&quot;0.00001&quot; step=&quot;0.0001&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;calculate()&quot; style=&quot;margin:12px 0&quot;&gt;Calculate and Explain&lt;/button&gt;&lt;div id=&quot;calcResult&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Estimate k from Two Samples&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₁ (mg/L)&lt;/label&gt;&lt;input id=&quot;c1&quot; type=&quot;number&quot; value=&quot;12&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;C₂ (mg/L)&lt;/label&gt;&lt;input id=&quot;c2&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;0.001&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;t₁ (h)&lt;/label&gt;&lt;input id=&quot;t1&quot; type=&quot;number&quot; value=&quot;2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;t₂ (h)&lt;/label&gt;&lt;input id=&quot;t2&quot; type=&quot;number&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;twoPoints()&quot; class=&quot;primary&quot; style=&quot;margin:12px 0&quot;&gt;Calculate Slope and k&lt;/button&gt;&lt;div id=&quot;twoResult&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;cases&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Clinical Pharmacy Simulations&lt;/h2&gt;&lt;p&gt;Hypothetical cases inspired by clinical practice. Interpret pharmacokinetic data; do not use for treatment decisions.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;button onclick=&quot;loadCase(0)&quot;&gt;Case 1: Concentration Monitoring&lt;/button&gt;&lt;button onclick=&quot;loadCase(1)&quot;&gt;Case 2: Clearance Change&lt;/button&gt;&lt;button onclick=&quot;loadCase(2)&quot;&gt;Case 3: Different Vd&lt;/button&gt;&lt;/div&gt;&lt;div id=&quot;caseView&quot; style=&quot;margin-top:16px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;urine&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Estimate k from Urine Data&lt;/h2&gt;&lt;p&gt;If the unchanged amount excreted in urine by time t is &lt;span class=&quot;ltr&quot;&gt;Ae(t)&lt;/span&gt;، and the final cumulative amount excreted is &lt;span class=&quot;ltr&quot;&gt;Ae∞&lt;/span&gt;، then:&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;Ae∞ − Ae(t) = Ae∞ × e&lt;sup&gt;−kt&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Two measurements of the remaining amount can estimate k. This method requires reliable urine collection, unchanged drug excretion, and valid model assumptions.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae∞ (mg)&lt;/label&gt;&lt;input id=&quot;aeinf&quot; type=&quot;number&quot; value=&quot;200&quot; min=&quot;0.01&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae at first time (mg)&lt;/label&gt;&lt;input id=&quot;ae1&quot; type=&quot;number&quot; value=&quot;80&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ae at second time (mg)&lt;/label&gt;&lt;input id=&quot;ae2&quot; type=&quot;number&quot; value=&quot;140&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;First time (h)&lt;/label&gt;&lt;input id=&quot;ut1&quot; type=&quot;number&quot; value=&quot;2&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Second time (h)&lt;/label&gt;&lt;input id=&quot;ut2&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;0&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;urineCalc()&quot; style=&quot;margin:12px 0&quot;&gt;احسب k&lt;/button&gt;&lt;div id=&quot;urineResult&quot;&gt;&lt;/div&gt;&lt;h3&gt;ملاحظة مهمة&lt;/h3&gt;&lt;p&gt;يميز الفصل بين Elimination Rate Constant الكلي &lt;span class=&quot;ltr&quot;&gt;k&lt;/span&gt; وElimination Rate Constant الكلوي للدواء غير المتغير &lt;span class=&quot;ltr&quot;&gt;ke&lt;/span&gt;؛ لا يجوز مساواتهما إلا إذا كان الإطراح الكلوي هو المسار الوحيد.&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;Ae∞ = (ke / k) × Dose &amp;nbsp; ⇒ &amp;nbsp; ke = k × Ae∞ / Dose&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;quiz&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;اختبار الفهم والتطبيق&lt;/h2&gt;&lt;p&gt;اختر إجابة واحدة لكل سؤال. ستظهر النتيجة مع شرح علمي لكل إجابة.&lt;/p&gt;&lt;div id=&quot;questions&quot;&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; onclick=&quot;grade()&quot;&gt;تCorrect Quiz&lt;/button&gt;&lt;button onclick=&quot;resetQuiz()&quot;&gt;إعادة المحاولة&lt;/button&gt;&lt;div id=&quot;score&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;محتوى تعليمي مستقل مستند إلى الفصل 4 (ص 75–96) — للاستخدام الأكاديمي فقط، وليس لاتخاذ قرارات علاجية.&lt;/footer&gt;&lt;script&gt;\nconst lessons=[[&quot;Introduction and assumptions — pp. 75–76&quot;, &quot;An IV bolus enters the systemic circulation directly. The one-compartment open model assumes rapid uniform mixing and drug elimination from the body. The model describes plasma concentration, not necessarily the concentration in each tissue.&quot;, &quot;IV bolus → rapid mixing → first-order elimination&quot;, &quot;A clear multiphasic distribution phase or nonlinear elimination can invalidate this model.&quot;], [&quot;Elimination rate constant — p. 76&quot;, &quot;With first-order elimination, the rate of drug loss is proportional to the amount remaining. k is measured in inverse time, such as h⁻¹. A constant fraction, rather than a constant mass, disappears over each equal time interval.&quot;, &quot;dA/dt = −kA  |  A(t) = A₀ e^(−kt)  |  C(t) = C₀ e^(−kt)&quot;, &quot;At k = 0.2 h⁻¹, the fraction remaining after 5 h is e^(−1), or approximately 36.8%.&quot;], [&quot;Half-life and semilog plots — pp. 76–77&quot;, &quot;Half-life is the time for concentration to decrease by 50%. Under first-order kinetics it is independent of the starting concentration. ln(C) versus time is linear with slope −k; log10(C) has slope −k/2.303.&quot;, &quot;t½ = 0.693/k  |  ln(C) = ln(C₀) − kt&quot;, &quot;Estimate k from plasma samples taken in the appropriate elimination phase.&quot;], [&quot;Apparent volume of distribution — pp. 77–80&quot;, &quot;Vd relates the drug amount in the body to its measured plasma concentration. After an IV bolus, C₀ = Dose/Vd. It is an apparent proportionality parameter, not a literal anatomical volume, and can exceed body-fluid volume.&quot;, &quot;Vd = Dose/C₀  |  C₀ = Dose/Vd&quot;, &quot;At a fixed dose, a larger Vd produces a lower initial plasma concentration.&quot;], [&quot;Clearance — pp. 80–85&quot;, &quot;CL is the hypothetical volume of plasma cleared of drug per unit time. For this model CL = k × Vd. Clearance differs from the mass eliminated per hour; elimination rate depends on concentration.&quot;, &quot;CL = k × Vd  |  Rate of elimination = CL × C&quot;, &quot;With Vd = 40 L and k = 0.2 h⁻¹, CL = 8 L/h.&quot;], [&quot;Area under the curve — pp. 80–85&quot;, &quot;AUC measures total plasma exposure over time. For a linear IV bolus model, AUC from zero to infinity equals C₀/k or Dose/CL, with units such as mg·h/L.&quot;, &quot;AUC₀–∞ = C₀/k = Dose/CL&quot;, &quot;At a fixed dose, lower clearance increases AUC. This alone does not determine a clinical dose.&quot;], [&quot;Clinical applications — pp. 85, 89&quot;, &quot;The model helps interpret plasma samples, estimate parameters, and understand how clearance and distribution affect concentrations. Real patients require drug-specific validation and suitable sampling times.&quot;, &quot;C(t) = (Dose/Vd) × e^(−CL·t/Vd)&quot;, &quot;Clinical dosing requires validated drug data and qualified assessment.&quot;], [&quot;Urinary excretion — pp. 86–89&quot;, &quot;The sigma-minus method estimates elimination from the amount of unchanged drug still to be excreted. Plot ln[Ae∞ − Ae(t)] versus time; the slope equals −k. Urinary excretion-rate methods are another approach.&quot;, &quot;ln[Ae∞ − Ae(t)] = ln(Ae∞) − kt&quot;, &quot;Incomplete collection or an incorrect Ae∞ estimate biases results.&quot;], [&quot;Practice and review — pp. 87–96&quot;, &quot;The chapter concludes with worked problems, learning questions, answers and references. Always check units: mg for dose, mg/L for concentration, L for Vd, h⁻¹ for k, L/h for CL, and h for half-life.&quot;, &quot;Dose = C₀ × Vd  |  k = ln(C₁/C₂)/(t₂−t₁)&quot;, &quot;Write the known values, formula, substitution and units; then check plausibility.&quot;]];\ndocument.getElementById(&#x27;lessonCards&#x27;).innerHTML=lessons.map((x,i)=&gt;`&lt;article class=&quot;card&quot;&gt;&lt;h2&gt;${i+1}. ${x[0]}&lt;/h2&gt;&lt;p&gt;${x[1]}&lt;/p&gt;&lt;div class=&quot;eq&quot;&gt;${x[2]}&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;${x[3]}&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;);\ndocument.querySelectorAll(&#x27;nav button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{document.querySelectorAll(&#x27;nav button,.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));b.classList.add(&#x27;active&#x27;);document.getElementById(b.dataset.tab).classList.add(&#x27;active&#x27;);if(b.dataset.tab===&#x27;sim&#x27;)simulate()});const v=id=&gt;Number(document.getElementById(id).value),f=(x,n=3)=&gt;Number.isFinite(x)?x.toFixed(n):&#x27;—&#x27;;const ok=(...a)=&gt;a.every(x=&gt;Number.isFinite(x)&amp;&amp;x&gt;0);function simulate(){let d=v(&#x27;dose&#x27;),V=v(&#x27;vd&#x27;),k=v(&#x27;k&#x27;),t=v(&#x27;t&#x27;);if(!ok(d,V,k)||t&lt;0||!Number.isFinite(t)){document.getElementById(&#x27;simStats&#x27;).innerHTML=&#x27;أدخل قيمًا موجبة وCorrectة.&#x27;;return}let c0=d/V,c=c0*Math.exp(-k*t),half=Math.log(2)/k,cl=k*V;document.getElementById(&#x27;simStats&#x27;).innerHTML=[[&#x27;C₀&#x27;,f(c0)+&#x27; mg/L&#x27;],[&#x27;C(t)&#x27;,f(c)+&#x27; mg/L&#x27;],[&#x27;Half-life&#x27;,f(half)+&#x27; h&#x27;],[&#x27;Clearance&#x27;,f(cl)+&#x27; L/h&#x27;],[&#x27;AUC&#x27;,f(d/cl)+&#x27; mg·h/L&#x27;]].map(a=&gt;`&lt;div class=&quot;stat&quot;&gt;${a[0]}&lt;strong&gt;${a[1]}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);document.getElementById(&#x27;interpret&#x27;).textContent=`بعد ${f(t,1)} ساعة يبقى ${f(100*Math.exp(-k*t),1)}% من التركيز الابتدائي. زيادة Dose ترفع المنحنى، وزيادة k تسرّع انخفاضه.`;let canvas=document.getElementById(&#x27;chart&#x27;),ctx=canvas.getContext(&#x27;2d&#x27;),W=canvas.width,H=canvas.height,p=65,maxT=Math.max(12,half*5,t*1.2),x=z=&gt;p+(W-p-25)*z/maxT,y=z=&gt;H-p-(H-p-30)*z/c0;ctx.clearRect(0,0,W,H);ctx.strokeStyle=&#x27;#d8e5ef&#x27;;ctx.lineWidth=1;for(let i=0;i&lt;=5;i++){let yy=y(c0*i/5);ctx.beginPath();ctx.moveTo(p,yy);ctx.lineTo(W-25,yy);ctx.stroke();ctx.fillStyle=&#x27;#506b82&#x27;;ctx.font=&#x27;15px sans-serif&#x27;;ctx.fillText(f(c0*i/5,1),6,yy+5)}for(let i=0;i&lt;=6;i++){let xx=x(maxT*i/6);ctx.beginPath();ctx.moveTo(xx,30);ctx.lineTo(xx,H-p);ctx.stroke();ctx.fillText(f(maxT*i/6,1),xx-12,H-22)}ctx.beginPath();ctx.strokeStyle=&#x27;#1166b4&#x27;;ctx.lineWidth=4;for(let i=0;i&lt;=250;i++){let z=maxT*i/250; i?ctx.lineTo(x(z),y(c0*Math.exp(-k*z))):ctx.moveTo(x(z),y(c0))}ctx.stroke();ctx.setLineDash([7,6]);ctx.strokeStyle=&#x27;#c35e2b&#x27;;ctx.beginPath();ctx.moveTo(x(t),H-p);ctx.lineTo(x(t),y(c));ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.fillStyle=&#x27;#c35e2b&#x27;;ctx.arc(x(t),y(c),6,0,Math.PI*2);ctx.fill()}[&#x27;dose&#x27;,&#x27;vd&#x27;,&#x27;k&#x27;,&#x27;t&#x27;].forEach(id=&gt;document.getElementById(id).addEventListener(&#x27;input&#x27;,simulate));function calculate(){let d=v(&#x27;cd&#x27;),c=v(&#x27;cc&#x27;),k=v(&#x27;ck&#x27;),el=document.getElementById(&#x27;calcResult&#x27;);if(!ok(d,c,k)){el.textContent=&#x27;All three values must be positive.&#x27;;return}let V=d/c,cl=k*V;el.innerHTML=`&lt;div class=&quot;grid&quot;&gt;${[[&#x27;Vd&#x27;,f(V)+&#x27; L&#x27;],[&#x27;CL&#x27;,f(cl)+&#x27; L/h&#x27;],[&#x27;t½&#x27;,f(.693147/k)+&#x27; h&#x27;],[&#x27;AUC&#x27;,f(c/k)+&#x27; mg·h/L&#x27;]].map(a=&gt;`&lt;div class=&quot;stat&quot;&gt;${a[0]}&lt;strong&gt;${a[1]}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;Solution steps: Vd = Dose/C₀ = ${f(d)}/${f(c)} = ${f(V)} L. ثم CL = k×Vd = ${f(k)}×${f(V)} = ${f(cl)} L/h. وHalf-life = 0.693/k.&lt;/p&gt;`}function twoPoints(){let a=v(&#x27;c1&#x27;),b=v(&#x27;c2&#x27;),t1=v(&#x27;t1&#x27;),t2=v(&#x27;t2&#x27;),el=document.getElementById(&#x27;twoResult&#x27;);if(!ok(a,b)||t2&lt;=t1||b&gt;=a){el.textContent=&#x27;Require t₂ &gt; t₁ and 0 &lt; C₂ &lt; C₁.&#x27;;return}let k=Math.log(a/b)/(t2-t1);el.innerHTML=`&lt;div class=&quot;stat&quot;&gt;k = &lt;strong&gt;${f(k,5)} h⁻¹&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;k = ln(${a}/${b}) / (${t2}−${t1}). Half-life = ${f(.693147/k)} h؛ وC₀ estimated = ${f(a*Math.exp(k*t1))} mg/L.&lt;/p&gt;`}\nconst cases=[{&quot;name&quot;: &quot;Concentration after an IV bolus&quot;, &quot;d&quot;: 500, &quot;V&quot;: 50, &quot;k&quot;: 0.1733, &quot;t&quot;: 4, &quot;question&quot;: &quot;What is the expected concentration after four hours?&quot;, &quot;answer&quot;: &quot;C₀ = 500/50 = 10 mg/L. After 4 h, concentration is approximately 5 mg/L, consistent with a half-life near 4 h.&quot;}, {&quot;name&quot;: &quot;Reduced clearance at constant Vd&quot;, &quot;d&quot;: 400, &quot;V&quot;: 40, &quot;k&quot;: 0.1, &quot;t&quot;: 6, &quot;question&quot;: &quot;How do the results change if k falls from 0.2 to 0.1 h⁻¹?&quot;, &quot;answer&quot;: &quot;CL decreases from 8 to 4 L/h; half-life doubles from approximately 3.47 to 6.93 h and AUC doubles at the same dose. This is not a clinical dosing recommendation.&quot;}, {&quot;name&quot;: &quot;Higher Vd with unchanged clearance&quot;, &quot;d&quot;: 400, &quot;V&quot;: 80, &quot;k&quot;: 0.1, &quot;t&quot;: 4, &quot;question&quot;: &quot;Compare with Vd = 40 L and CL = 8 L/h.&quot;, &quot;answer&quot;: &quot;At Vd = 80 L and CL = 8 L/h, k = 0.1 h⁻¹ and C₀ = 5 mg/L instead of 10 mg/L. Half-life increases while AUC remains 50 mg·h/L if dose and clearance are unchanged.&quot;}];function loadCase(i){let a=cases[i];document.getElementById(&#x27;caseView&#x27;).innerHTML=`&lt;h3&gt;${a.name}&lt;/h3&gt;&lt;p&gt;Hypothetical dose ${a.d} mg، volume of distribution ${a.V} L، elimination constant ${a.k} h⁻¹.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Question for the trainee pharmacist:&lt;/b&gt; ${a.question}&lt;/p&gt;&lt;button onclick=&quot;document.getElementById(&#x27;caseAnswer&#x27;).hidden=false&quot;&gt;Show Analysis&lt;/button&gt;&lt;div id=&quot;caseAnswer&quot; hidden class=&quot;note&quot; style=&quot;margin-top:10px&quot;&gt;${a.answer}&lt;/div&gt;&lt;button onclick=&quot;document.getElementById(&#x27;dose&#x27;).value=${a.d};document.getElementById(&#x27;vd&#x27;).value=${a.V};document.getElementById(&#x27;k&#x27;).value=${a.k};document.getElementById(&#x27;t&#x27;).value=${a.t};document.querySelector(&#x27;[data-tab=sim]&#x27;).click()&quot; class=&quot;primary&quot;&gt;افتح هذه الحالة في Simulation&lt;/button&gt;`}loadCase(0);function urineCalc(){let inf=v(&#x27;aeinf&#x27;),a=v(&#x27;ae1&#x27;),b=v(&#x27;ae2&#x27;),t1=v(&#x27;ut1&#x27;),t2=v(&#x27;ut2&#x27;),el=document.getElementById(&#x27;urineResult&#x27;);if(!ok(inf)||a&lt;0||b&lt;=a||b&gt;=inf||t2&lt;=t1){el.textContent=&#x27;Require 0 ≤ Ae₁ &lt; Ae₂ &lt; Ae∞ and t₂ &gt; t₁.&#x27;;return}let k=Math.log((inf-a)/(inf-b))/(t2-t1);el.innerHTML=`&lt;div class=&quot;stat&quot;&gt;k = &lt;strong&gt;${f(k,5)} h⁻¹&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;Remaining amount initially: ${f(inf-a)} mg، and subsequently: ${f(inf-b)} mg؛ إذن k = ln[${f(inf-a)}/${f(inf-b)}] / (${t2}−${t1}). Half-life ≈ ${f(.693147/k)} h.&lt;/p&gt;`}\nconst questions=[[&quot;What does “open” mean in this model?&quot;, [&quot;Oral absorption occurs&quot;, &quot;Drug can leave the body&quot;, &quot;There are two compartments&quot;], 1, &quot;Drug may leave through excretion or metabolism.&quot;], [&quot;What are the units of k?&quot;, [&quot;L/h&quot;, &quot;mg/L&quot;, &quot;h⁻¹&quot;], 2, &quot;First-order elimination constants have inverse-time units.&quot;], [&quot;If k = 0.231 h⁻¹, what is the approximate half-life?&quot;, [&quot;3 h&quot;, &quot;6 h&quot;, &quot;0.33 h&quot;], 0, &quot;0.693/0.231 = 3 h.&quot;], [&quot;Dose = 200 mg and C₀ = 5 mg/L. What is Vd?&quot;, [&quot;40 L&quot;, &quot;1000 L&quot;, &quot;0.025 L&quot;], 0, &quot;Vd = 200/5 = 40 L.&quot;], [&quot;If Vd = 30 L and k = 0.2 h⁻¹, what is CL?&quot;, [&quot;150 L/h&quot;, &quot;6 L/h&quot;, &quot;30.2 L/h&quot;], 1, &quot;CL = k × Vd = 6 L/h.&quot;], [&quot;Which statement about Vd is correct?&quot;, [&quot;It is an anatomical volume&quot;, &quot;It cannot exceed total body water&quot;, &quot;It is an apparent volume inferred from amount and concentration&quot;], 2, &quot;Vd is a proportionality parameter.&quot;], [&quot;After two half-lives, what fraction remains?&quot;, [&quot;25%&quot;, &quot;50%&quot;, &quot;75%&quot;], 0, &quot;One quarter remains.&quot;], [&quot;If the dose doubles while Vd stays constant, what happens to C₀?&quot;, [&quot;It doubles&quot;, &quot;It halves&quot;, &quot;It stays constant&quot;], 0, &quot;C₀ = Dose/Vd.&quot;], [&quot;What is AUC after a linear IV bolus?&quot;, [&quot;CL/Dose&quot;, &quot;Dose/CL&quot;, &quot;Dose × CL&quot;], 1, &quot;AUC = Dose/CL.&quot;], [&quot;What is the slope of ln(C) versus time?&quot;, [&quot;−k&quot;, &quot;k/2&quot;, &quot;−Vd&quot;], 0, &quot;ln(C) = ln(C₀) − kt.&quot;], [&quot;If CL halves at the same dose, what happens to AUC?&quot;, [&quot;It halves&quot;, &quot;It doubles&quot;, &quot;It stays constant&quot;], 1, &quot;AUC = Dose/CL.&quot;], [&quot;What is a key requirement of the sigma-minus urine method?&quot;, [&quot;Incomplete collection is acceptable&quot;, &quot;Ae∞ is not needed&quot;, &quot;Reliable collection and Ae∞ estimation&quot;], 2, &quot;The terminal amount and collection data must be reliable.&quot;], [&quot;Are total elimination k and renal unchanged-drug ke always equal?&quot;, [&quot;Yes&quot;, &quot;No, except under special conditions&quot;, &quot;Only at high doses&quot;], 1, &quot;Total elimination includes multiple pathways.&quot;], [&quot;Why might this model fail for some drugs?&quot;, [&quot;A distinct multiphasic distribution phase&quot;, &quot;All drugs absorb orally&quot;, &quot;Elimination is always zero-order&quot;], 0, &quot;Multiple compartments or nonlinearity can violate assumptions.&quot;], [&quot;Concentration drops from 8 to 4 mg/L in 2 h. What is k?&quot;, [&quot;0.347 h⁻¹&quot;, &quot;2 h⁻¹&quot;, &quot;4 h⁻¹&quot;], 0, &quot;k = ln(2)/2 ≈ 0.347 h⁻¹.&quot;]];function renderQuiz(){document.getElementById(&#x27;questions&#x27;).innerHTML=questions.map((q,i)=&gt;`&lt;div class=&quot;q&quot;&gt;&lt;b&gt;${i+1}. ${q[0]}&lt;/b&gt;${q[1].map((o,j)=&gt;`&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q${i}&quot; value=&quot;${j}&quot; style=&quot;width:auto&quot;&gt; ${o}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;div id=&quot;fb${i}&quot; class=&quot;small&quot;&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}function grade(){let score=0;questions.forEach((q,i)=&gt;{let selected=document.querySelector(`input[name=q${i}]:checked`),correct=selected&amp;&amp;Number(selected.value)===q[2];if(correct)score++;document.getElementById(&#x27;fb&#x27;+i).innerHTML=`&lt;span class=&quot;${correct?&#x27;good&#x27;:&#x27;bad&#x27;}&quot;&gt;${correct?&#x27;Correct&#x27;:&#x27;الإجابة الCorrectة: &#x27;+q[1][q[2]]}&lt;/span&gt; — ${q[3]}`});document.getElementById(&#x27;score&#x27;).innerHTML=`&lt;h3&gt;Score: ${score} / ${questions.length} (${f(score/questions.length*100,0)}%)&lt;/h3&gt;`}function resetQuiz(){renderQuiz();document.getElementById(&#x27;score&#x27;).innerHTML=&#x27;&#x27;}renderQuiz();calculate();twoPoints();simulate();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\n\" hidden loading=\"eager\"><\/iframe><script>function switchLang(lang){let isAr=lang==='ar';document.getElementById('arabic').hidden=!isAr;document.getElementById('english').hidden=isAr;document.getElementById('arBtn').setAttribute('aria-pressed',String(isAr));document.getElementById('enBtn').setAttribute('aria-pressed',String(!isAr));document.documentElement.lang=lang;document.documentElement.dir=isAr?'rtl':'ltr';try{localStorage.setItem('pk4-language',lang)}catch(e){}}try{switchLang(localStorage.getItem('pk4-language')==='en'?'en':'ar')}catch(e){switchLang('ar')}<\/script><\/body><\/html>";

if(tab==='lesson')body+=`<p class="lead">${lang==='ar'?c.ax:c.ex}</p><h3>${tr('الفكرة العلمية الأساسية','Core scientific idea')}</h3><div class="explain">${lang==='ar'?c.ay:c.ey}</div><h3>${tr('كيف تدرس هذا الفصل؟','How to study this chapter')}</h3><p>${tr('اقرأ الفكرة، وحدد المتغيرات ووحداتها، ثم استخدم الحالة التدريبية والاختبار. قارن الشرح بمادة الفصل الأصلية عند الحاجة.','Read the concept, identify variables and units, then practice with the case and quiz. Consult the original chapter for complete derivations and examples.')}</p><div class="explain">${tr('مثال مفاهيمي: اسأل دائمًا ما المتغير الذي نقيسه؟ وما الافتراضات التي تجعل النموذج صالحًا؟ وكيف تؤثر تغيرات المريض أو المستحضر في النتيجة؟','Conceptual example: What variable is measured? Which assumptions make the model valid? How could patient or formulation changes affect the result?')}</div>`;
if(tab==='case')body+=`<h3>${tr('تطبيق تدريبي من بيئة الصيدلة','Practice scenario from pharmacy')}</h3><p class="lead">${tr('يُراجع فريق صيدلي بيانات افتراضية لمستحضر دوائي، ويلاحظ اختلاف النتائج بين قياسين.','A pharmacy team reviews synthetic drug data and notices differences between two measurements.')}</p><div class="explain">${lang==='ar'?c.ax:c.ex}</div><p>${tr('المطلوب: حدّد المعلمة ذات الصلة، واكتب الافتراضات، واذكر سببًا واحدًا قد يجعل تفسير البيانات غير دقيق. لا تقترح جرعة علاجية.','Task: identify the relevant parameter, list model assumptions, and give one reason data interpretation might be misleading. Do not propose a clinical dose.')}</p><button onclick="this.nextElementSibling.hidden=false">${tr('إظهار منهج الحل','Show reasoning framework')}</button><div hidden class="explain">${tr('1) تحقّق من الوحدات. 2) حدّد طريقة إعطاء الدواء والزمن. 3) افحص افتراض الخطية أو ثبات الحالة. 4) قارن النتيجة بسياق الحالة، ولا تستنتج قرارًا علاجيًا من النموذج وحده.','1) Verify units. 2) Identify route and sampling time. 3) Check linearity and steady-state assumptions. 4) Interpret in context; never infer treatment from a model alone.')}</div>`;
if(tab==='quiz'){const question=lang==='ar'?`ما العبارة الصحيحة في موضوع «${c.ar}»؟`:`Which statement about “${c.en}” is most accurate?`;const opts=lang==='ar'?[c.ay,'يمكن استخدام أي نموذج بلا افتراضات أو بيانات.','لا أهمية لوحدات القياس في الحسابات الدوائية.']: [c.ey,'Any model can be used without assumptions or data.','Units do not matter in pharmacokinetic calculations.'];body+=`<h3>${tr('اختبار مفاهيمي','Concept check')}</h3><div class="question"><strong>${question}</strong>${opts.map((x,i)=>`<button onclick="answer(${i},this)">${x}</button>`).join('')}<div id="feedback" class="explain" hidden></div></div><p class="muted">${tr('سؤال تمهيدي واحد لكل فصل في هذه النسخة؛ بنك الأسئلة الموسّع يحتاج تطويرًا إضافيًا.','One introductory question per chapter in this edition; a comprehensive question bank requires further development.')}</p>`}

function draw(){let d=+$('dose').value,v=+$('vd').value,k=+$('k').value,t=+$('time').value;if(!Number.isFinite(d+v+k+t)||d<0||v<=0||k<=0||t<0){$('out').textContent=tr('تحقق من القيم: الجرعة والزمن غير سالبين، والحجم والثابت موجبان.','Check inputs: dose/time nonnegative, volume/rate positive.');$('plot').innerHTML='';return}let c0=d/v,c=c0*Math.exp(-k*t),cl=k*v,half=Math.log(2)/k;$('out').innerHTML=`<div class="grid"><div>C₀: <span class="result">${c0.toFixed(3)}</span> mg/L</div><div>C(${t}h): <span class="result">${c.toFixed(3)}</span> mg/L</div><div>CL: <span class="result">${cl.toFixed(3)}</span> L/h</div><div>t½: <span class="result">${half.toFixed(2)}</span> h</div><div>AUC: <span class="result">${(d/cl).toFixed(2)}</span> mg·h/L</div></div>`;let maxT=Math.max(24,t*1.2,half*5),pts=Array.from({length:121},(_,i)=>{let x=45+610*i/120,y=220-185*Math.exp(-k*maxT*i/120);return `${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ');$('plot').innerHTML=`<line x1="45" y1="220" x2="660" y2="220" stroke="#789"/><line x1="45" y1="22" x2="45" y2="220" stroke="#789"/><path d="${pts}" fill="none" stroke="#087fb6" stroke-width="3"/><text x="10" y="22">${c0.toFixed(1)}</text><text x="10" y="222">0</text><text x="605" y="245">${maxT.toFixed(0)} h</text><text x="70" y="20">C (mg/L)</text>`}
